  <!-- A visitor who chose Arabic or Kurdish before is taken to that language's address. -->
  <script>
    try {
      var saved = localStorage.getItem('itland-language'), path = location.pathname;
      if ((saved === 'ar' || saved === 'ku') && !/^\/(ar|ku|admin|wholesale|app|api)(\/|$)/.test(path)) {
        location.replace('/' + saved + (path === '/' ? '' : path) + location.search + location.hash);
      }
    } catch (error) { /* Storage may be unavailable. */ }
  </script>
